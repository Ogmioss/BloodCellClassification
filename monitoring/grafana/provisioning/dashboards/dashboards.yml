# Grafana Dashboard Provisioning
apiVersion: 1

providers:
  - name: 'BloodCell Dashboards'
    orgId: 1
    folder: 'BloodCell Classification'
    folderUid: bloodcell
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
