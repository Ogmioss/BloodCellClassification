# =============================================================================
# Docker Compose - Light Profile
# =============================================================================
#
# Contains ONLY: API + Streamlit + MinIO + MLflow
# No Airflow, no PostgreSQL, no Prometheus, no Grafana.
#
# Usage:
#   docker compose -f docker/docker-compose.light.yml up -d
#
# =============================================================================

services:
  # ===========================================================================
  # FastAPI - ML Runtime (ONLY container with PyTorch)
  # ===========================================================================
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: bloodcell-api
    ports:
      - "8000:8000"
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - PYTHONPATH=/app
      - DOCKER=1
      - AWS_ACCESS_KEY_ID=minio
      - AWS_SECRET_ACCESS_KEY=minio123
      - MLFLOW_S3_ENDPOINT_URL=http://minio:9000
    volumes:
      - ../models:/app/models
      - ../data:/app/data
      - ../conf.yaml:/app/conf.yaml
      - ../mlruns:/app/mlruns
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always

  # ===========================================================================
  # MinIO S3-compatible Object Storage
  # ===========================================================================
  minio:
    image: minio/minio:RELEASE.2024-06-13T22-53-53Z
    container_name: bloodcell-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: always

  minio-init:
    image: minio/mc:RELEASE.2024-06-12T14-34-03Z
    container_name: bloodcell-minio-init
    entrypoint: /bin/sh
    command:
      - -c
      - |
        until mc alias set local http://minio:9000 minio minio123; do sleep 2; done
        mc mb --ignore-existing local/mlflow-artifacts
        mc mb --ignore-existing local/datasets
        mc mb --ignore-existing local/checkpoints
        echo "Buckets created successfully"
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

  # ===========================================================================
  # MLflow Tracking Server (lightweight - no ML deps)
  # ===========================================================================
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.17.0
    container_name: bloodcell-mlflow
    command: >
      mlflow server
      --backend-store-uri sqlite:////mlruns/mlflow.db
      --default-artifact-root s3://mlflow-artifacts/
      --host 0.0.0.0
      --port 5000
      --serve-artifacts
    ports:
      - "5000:5000"
    environment:
      AWS_ACCESS_KEY_ID: minio
      AWS_SECRET_ACCESS_KEY: minio123
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
    volumes:
      - ../mlruns:/mlruns
    depends_on:
      minio-init:
        condition: service_completed_successfully
    restart: always

  # ===========================================================================
  # Streamlit Dashboard
  # ===========================================================================
  streamlit:
    build:
      context: ..
      dockerfile: docker/Dockerfile.streamlit
    container_name: bloodcell-streamlit
    ports:
      - "8501:8501"
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - FASTAPI_URL=http://api:8000
    volumes:
      - ../models:/app/models
      - ../data:/app/data
    depends_on:
      - api
      - mlflow
    restart: always

volumes:
  minio-data:
